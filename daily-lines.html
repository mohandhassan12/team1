<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل البيانات</title>
  <link rel="stylesheet" href="style/stylelines.css">
  <link rel="stylesheet" href="style/stylehome.css">
  <link rel="shortcut icon" href="img/Team-Warek-Logo.jpg" type="image/x-icon">
  <!-- تحميل سكريبت بدون type="module" -->
  <script src="script/daily-lines.js" defer></script>
</head>

<body>
  <div class="header">
    <img src="img/Team-Warek-Logo.jpg" alt="Logo" class="logo">
    <div class="welcome">مرحبًا، <span id="username"></span>!</div>
    <a href="home.html"><i class="fa-solid fa-house-user"></i> home</a>
  </div>

  <div class="data-entry-container">
    <h2>تسجيل البيانات</h2>

    <form id="dataEntryForm">
      <!-- عدد الخطوط -->
      <label for="lines">عدد الخطوط:</label>
      <input type="number" id="lines" required min="1">
      <div id="packageContainer"></div>

      <!-- We Pay -->
      <label>We Pay:</label>
      <input type="number" id="wePay" required>

      <!-- Port in -->
      <label>Port in:</label>
      <input type="number" id="mnp" required>

      <!-- ADSL -->
      <label for="adsl">ADSL:</label>
      <input type="number" id="adsl" required min="0">
      <div id="adslContainer"></div>

      <!-- Fixed -->
      <label>Fixed:</label>
      <input type="number" id="fixed" required>

      <!-- Egyption -->
      <label>Egyption:</label>
      <input type="number" id="egyption" required>

      <!-- Foreign -->
      <label>Foreign:</label>
      <input type="number" id="foreign" required>

      <!-- زر الإرسال -->
      <button type="submit">إرسال البيانات</button>
    </form>
  </div>
</body>
</html>
